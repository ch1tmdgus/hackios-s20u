# Samsung Galaxy S20 Ultra 5G -- the y2q's port moved over (z3q.dtb, xbl.img and the G988N's GPT checked against the y2q's:
# see docs/Z3Q.md). The kernel treats a z3q as a y2q wherever the hardware is the same (redwood_platform_is).
NAME="Samsung Galaxy S20 Ultra 5G (z3q, SM-G988N)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Samsung has no fastboot: out/z3q-boot.img goes to the boot partition from TWRP (keep a backup of the
# original boot image -- it holds Android's kernel and Magisk). XL_DEVICE=z3q ./xl enter does that, after
# asking; ./xl restore-boot FILE puts the backup back.
BOOT_VIA=twrp
UEFI_TARGET=z3q
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/z3qPkg/... (no prebuilt for z3q)
DTB=uefi/files/Resources/DTBs/z3q.dtb   # from the phone (/sys/firmware/fdt), board-id 15, PVR Rev05
FD_BASE=0x9FC00000              # "UEFI FD" in the phone's own uefiplat.cfg and in r8q.toml
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # free DDR on the 12 GB board; xnuloader/loader.c has it hard-coded too

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x9C000000              # "Display Reserved" / cont_splash_region; 1440 x 3200 (S6E3HAB, default timing wqhd60) -- TODO: check
WIFI_ATH11K=0                   # QCA6390 on PCIe (pcie0 @ 0x1c00000): needs a PCIe host driver first

# --- what the run needs ----------------------------------------------------------------------------
# Start with no extras: framebuffer only. Touch (sec_ts @ i2c 0x994000, addr 0x48, IRQ TLMM 15) needs a
# driver before touchscreen=1 means anything here.
BOOTARGS="cpus=8"
DEFAULT_SECS=300
# First RAM boot uses the prebuilt programs without the separately built Mesa libraries.
# Enable GL=1 explicitly only after those libraries have been built.
USERLAND_VARS="GL="
# Adreno 650: a650_{sqe.fw,gmu.bin,zap.*} from /vendor/firmware, kept in fw-gpu/
FIRMWARE=""
# The boot without the computer (xl autoboot-image / install-autoboot): the kernel on the biggest core while
# the loader serves the flash from the first (ufs=2), the root the iOS volume in darwin, no time limit;
# what iOS writes kept in darwin past the volume and the cryptexes (var_store=1 ufs_write=1: saved at
# power-off, on the five-finger hold, and every ten minutes; put back at the next boot); the GPU started
# and kept for CoreAnimation (gpu=1, images built with GL=1); the battery and the charger read from the
# MAX77705 (max77705=1: bsd/dev/redwood_max77705.c); the Wi-Fi brought up beside the start (wifi=1: the
# BCM4375 and brcmfmac, docs/y2q-wifi.md), joining fw/network if the images have it
# First boot: the loader, the kernel, the root in darwin, no extras. Add touchscreen=1, max77705=1, gpu=1, wifi=1 one at a time
# once the framebuffer and SpringBoard come up (the y2q's line: ... touchscreen=1 ... gpu=1 max77705=1 wifi=1).
# (no var_store/ufs_write: the prebuilt kernel checks darwin's place against the y2q's, so it would not ask for writes; /var stays in RAM)
AUTOBOOT_ARGS="cpus=8 bootcpu=7 ufs=2 root_apfs=ufs_darwin sb_delay=8"
